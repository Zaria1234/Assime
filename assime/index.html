<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176B52" />
    <meta name="description" content="Assimé : retrouve ta moto, trouve ta boutique et fais tes courses au marché d'Asigamé (Lomé), guidé·e dans ta langue." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" />
    <title>Assimé — ne te perds plus au marché</title>
    <script>
      // Mode sombre appliqué avant l'affichage (pas d'éclair blanc) : même règle que src/store.jsx
      try {
        var a = JSON.parse(localStorage.getItem('assime_apparence') || '"auto"')
        if (a === 'sombre' || (a === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('sombre')
      } catch (e) { /* stockage indisponible : thème clair */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
